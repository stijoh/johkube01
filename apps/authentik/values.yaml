# Disable external databases
postgresql:
  enabled: false

redis:
  enabled: false

# Authentik configuration
authentik:
  # Let the chart auto-generate the secret key
  secret_key: ""
  log_level: info
  
# Server configuration  
server:
  ingress:
    enabled: false

# Worker configuration
worker: {}

# Use Longhorn for persistence
persistence:
  enabled: true
  size: 5Gi
  storageClass: longhorn
